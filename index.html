
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabila's Pink Cat Adventure</title>
<style>
:root { --pink:#ff75b5; --deep:#b83275; --pale:#fff0f7; }
* { box-sizing:border-box }
body {
  margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
  background:radial-gradient(circle at top,#ffe0ef,#fff7fb 55%,#ffd3e8);
  font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#8e315e;
}
.game {
  width:min(760px,100%); background:#fffafd; border:3px solid #ff9ac8;
  border-radius:25px; padding:18px; box-shadow:0 12px 35px #e66da533;
  text-align:center;
}
h1 { margin:3px 0 4px; color:#df4c91; font-size:clamp(22px,5vw,34px) }
.sub { margin:0 0 12px; color:#a64d78 }
.hud {
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  background:#fff0f7;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-weight:700
}
canvas {
  width:100%; display:block; border:2px solid #ffc0dc; border-radius:16px;
  background:#fff5fa; touch-action:pan-y;
}
.controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:12px }
button {
  border:0; border-radius:999px; padding:11px 20px; font-weight:800;
  color:#fff; background:linear-gradient(135deg,#ff83bb,#e84f99); cursor:pointer;
  box-shadow:0 4px 0 #c83d80; font-size:15px
}
button:active { transform:translateY(3px);box-shadow:0 1px 0 #c83d80 }
.hint {font-size:13px;margin:12px 0 0;color:#a45a7d}
</style>
</head>
<body>
<main class="game">
  <h1>🎀 Nabila's Pink Cat Adventure 🎀</h1>
  <p class="sub">Bantu si kucing mengumpulkan hati! 💗</p>
  <div class="hud">
    <span>⭐ Skor: <b id="score">0</b></span>
    <span>💖 Hati: <b id="hearts">0</b></span>
    <span>🏆 Best: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="720" height="360" aria-label="Game kucing melompat"></canvas>
  <div class="controls">
    <button id="start">▶ Mulai</button>
    <button id="jump">🐾 Lompat</button>
    <button id="restart">↻ Ulangi</button>
  </div>
  <p class="hint">Tekan SPACE / ↑ atau tombol LOMPAT. Hindari batu dan kumpulkan hati pink!</p>
</main>
<script>
(() => {
 const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
 const scoreEl=document.getElementById('score'), heartsEl=document.getElementById('hearts'),bestEl=document.getElementById('best');
 let best=Number(localStorage.getItem('pinkCatBest')||0);
 bestEl.textContent=best;
 let cat, obstacles, hearts, score, collected, speed, frame, running, over;

 function reset(){
   cat={x:95,y:260,w:54,h:58,vy:0,onGround:true};
   obstacles=[];hearts=[];score=0;collected=0;
   speed=4;frame=0;running=false;over=false;
   scoreEl.textContent=0;heartsEl.textContent=0;
 }

 function rounded(x,y,w,h,r,color){
   ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
 }

 function drawCat(){
   const x=cat.x,y=cat.y;
   ctx.strokeStyle='#ef8ab8';ctx.lineWidth=9;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x+8,y+43);
   ctx.quadraticCurveTo(x-15,y+20,x+1,y+14);ctx.stroke();

   rounded(x+8,y+29,39,29,15,'#fff');
   rounded(x+3,y+2,48,43,18,'#fff');

   ctx.fillStyle='#fff';ctx.beginPath();
   ctx.moveTo(x+8,y+14);ctx.lineTo(x+10,y-4);ctx.lineTo(x+25,y+8);ctx.fill();
   ctx.beginPath();ctx.moveTo(x+30,y+8);ctx.lineTo(x+47,y-4);ctx.lineTo(x+47,y+17);ctx.fill();

   ctx.fillStyle='#ffb2d2';ctx.beginPath();
   ctx.moveTo(x+12,y+8);ctx.lineTo(x+13,y+1);ctx.lineTo(x+20,y+9);ctx.fill();
   ctx.beginPath();ctx.moveTo(x+36,y+9);ctx.lineTo(x+45,y+1);ctx.lineTo(x+44,y+12);ctx.fill();

   ctx.fillStyle='#69304f';ctx.beginPath();
   ctx.arc(x+18,y+23,3.4,0,7);ctx.arc(x+37,y+23,3.4,0,7);ctx.fill();

   ctx.fillStyle='#f27eae';ctx.beginPath();
   ctx.arc(x+27,y+30,2.5,0,7);ctx.fill();

   ctx.strokeStyle='#9a456d';ctx.lineWidth=1.5;ctx.beginPath();
   ctx.moveTo(x+27,y+32);ctx.quadraticCurveTo(x+23,y+37,x+20,y+33);
   ctx.moveTo(x+27,y+32);ctx.quadraticCurveTo(x+31,y+37,x+34,y+33);ctx.stroke();

   ctx.fillStyle='#ff6eaa';ctx.beginPath();
   ctx.moveTo(x+7,y+8);ctx.quadraticCurveTo(x-7,y-2,x+4,y-2);
   ctx.quadraticCurveTo(x+11,y-2,x+14,y+7);
   ctx.quadraticCurveTo(x+7,y+15,x+7,y+8);ctx.fill();

   ctx.beginPath();ctx.moveTo(x+14,y+7);
   ctx.quadraticCurveTo(x+25,y-4,x+25,y+5);
   ctx.quadraticCurveTo(x+23,y+15,x+14,y+7);ctx.fill();

   ctx.fillStyle='#ffe4f0';ctx.beginPath();
   ctx.arc(x+14,y+7,2,0,7);ctx.fill();
 }

 function drawBackground(){
   ctx.clearRect(0,0,720,360);
   const grad=ctx.createLinearGradient(0,0,0,360);
   grad.addColorStop(0,'#ffe5f1');grad.addColorStop(1,'#fff9fc');
   ctx.fillStyle=grad;ctx.fillRect(0,0,720,360);

   ctx.fillStyle='#ffd0e5';
   for(let i=0;i<8;i++){
     let x=(i*113-(frame*.35)%820+820)%820;
     ctx.beginPath();
     ctx.arc(x,65+(i%3)*26,18,0,7);
     ctx.arc(x+18,65+(i%3)*26,22,0,7);
     ctx.arc(x+37,65+(i%3)*26,16,0,7);
     ctx.fill();
   }

   ctx.fillStyle='#f7b6d3';ctx.fillRect(0,318,720,42);
   ctx.strokeStyle='#ed8fba';ctx.lineWidth=3;ctx.beginPath();
   ctx.moveTo(0,318);ctx.lineTo(720,318);ctx.stroke();

   ctx.fillStyle='#e98ab5';
   for(let x=20;x<720;x+=45){
     ctx.beginPath();ctx.arc(x,340,2,0,7);ctx.fill();
   }
 }

 function drawHeart(x,y){
   ctx.save();ctx.translate(x,y);ctx.fillStyle='#ff5fa6';
   ctx.beginPath();ctx.moveTo(0,7);
   ctx.bezierCurveTo(-24,-8,-12,-22,0,-10);
   ctx.bezierCurveTo(12,-22,24,-8,0,7);
   ctx.fill();ctx.restore();
 }

 function drawRock(o){
   rounded(o.x,o.y,o.w,o.h,8,'#bd91aa');
   rounded(o.x+5,o.y+4,o.w-12,7,4,'#e7bfd4');
 }

 function render(){
   drawBackground();
   hearts.forEach(h=>drawHeart(h.x,h.y));
   obstacles.forEach(drawRock);
   drawCat();

   if(!running&&!over){
     ctx.fillStyle='#a94779';ctx.textAlign='center';
     ctx.font='bold 23px Trebuchet MS';
     ctx.fillText('Tekan MULAI untuk bermain! 💗',360,185);
   }

   if(over){
     ctx.fillStyle='#a94779';ctx.textAlign='center';
     ctx.font='bold 30px Trebuchet MS';
     ctx.fillText('Game Over! 🐾',360,170);
     ctx.font='bold 17px Trebuchet MS';
     ctx.fillText('Skor kamu: '+score+'  •  Tekan ULANGI',360,203);
   }
 }

 function update(){
   if(!running)return;

   frame++;score=Math.floor(frame/5);
   scoreEl.textContent=score;
   speed=4+Math.min(4,score/100);

   if(frame%92===0)
     obstacles.push({x:740,y:286,w:26+Math.random()*16,h:32+Math.random()*14});

   if(frame%115===0)
     hearts.push({x:740,y:220+Math.random()*55,r:12});

   cat.vy+=0.62;cat.y+=cat.vy;
   if(cat.y>260){cat.y=260;cat.vy=0;cat.onGround=true;}

   obstacles.forEach(o=>o.x-=speed);
   hearts.forEach(h=>h.x-=speed);

   obstacles=obstacles.filter(o=>o.x+o.w>0);
   hearts=hearts.filter(h=>h.x>-30);

   for(const o of obstacles){
     if(cat.x+45>o.x+4&&cat.x+10<o.x+o.w&&cat.y+53>o.y+5){
       running=false;over=true;
     }
   }

   hearts=hearts.filter(h=>{
     let hit=cat.x+50>h.x-14&&cat.x<h.x+14&&cat.y+50>h.y-14&&cat.y<h.y+14;
     if(hit){collected++;heartsEl.textContent=collected;}
     return !hit;
   });

   if(score>best){
     best=score;bestEl.textContent=best;
     localStorage.setItem('pinkCatBest',best);
   }
 }

 function loop(){update();render();requestAnimationFrame(loop);}

 function jump(){
   if(!running)return;
   if(cat.onGround){cat.vy=-12.5;cat.onGround=false;}
 }

 document.getElementById('start').onclick=()=>{
   if(over)reset();
   running=true;
 };
 document.getElementById('jump').onclick=jump;
 document.getElementById('restart').onclick=()=>{
   reset();running=true;
 };
 document.addEventListener('keydown',e=>{
   if(e.code==='Space'||e.code==='ArrowUp'){
     e.preventDefault();jump();
   }
 });
 canvas.addEventListener('pointerdown',jump);

 reset();loop();
})();
</script>
</body>
</html>
